- id: seranking-crawler-no-accept-encoding-false-positive
  trigger: "se-ranking,audit,compression,brotli,gzip,css_uncompressed"
  symptom: "L'audit SE Ranking a signalé des ressources CSS "non compressées" alors que Brotli était bien actif en prod, parce que le crawler de l'audit n'envoie pas d'en-tête Accept-Encoding."
  rule: "Avant de traiter un finding "ressource non compressée" d'un outil d'audit SEO comme réel, vérifier directement via curl avec Accept-Encoding: br/gzip explicite si la compression est effectivement servie ; l'absence de cet en-tête côté crawler produit un faux positif systématique."
  provenance: { who: self, context: "consolidation du sommeil (SessionEnd)" }
  seen: 1
  added_at: "2026-07-18"
  last_updated: "2026-07-18"
  valid_at: "2026-07-18"
- id: prerendered-nav-invisible-to-js-off-crawlers
  trigger: "prerender,seo,indexation,crawlnav,react,nav,footer,liens-internes"
  symptom: "Le HTML prérendu de chaque page ne contenait aucun lien de navigation interne (header/footer rendus uniquement côté client React), ce qui laissait les crawlers sans JS sur des pages culs-de-sac et limitait l'indexation à une fraction des pages du sitemap."
  rule: "Pour un site avec prérendu statique + hydratation React, s'assurer que la navigation globale (header/footer) est reproduite en liens <a href> bruts dans le HTML prérendu lui-même, et pas seulement rendue côté client, sous peine de bloquer la découverte/indexation des pages par les crawlers qui n'exécutent pas le JS."
  provenance: { who: self, context: "consolidation du sommeil (SessionEnd)" }
  seen: 1
  added_at: "2026-07-18"
  last_updated: "2026-07-18"
  valid_at: "2026-07-18"
- id: ne-jamais-exprimer-un-override-resolution-de-d-2026-07-31
  trigger: "pnpm overrides, npm resolutions, undici, jsdom, vitest, MODULE_NOT_FOUND, nodriver, websockets 13.1, undetected-chromedriver, dependance transitive, semver caret, majeure breaking, wrap-handler.js"
  symptom: "L'override global undici >=7.28.0 a laisse pnpm resoudre undici 8.5.0, dont wrap-handler.js/unwrap-handler.js ont disparu, tuant jsdom@29 ; symetriquement websockets 15.0.1 tire en transitif a casse nodriver 0.48.1 (attribut closed sur objet non initialise) en affichant seulement 'Failed to connect to browser'."
  rule: "Ne jamais exprimer un override/resolution de dependance transitive avec une borne ouverte (>=X) : le scoper au consommateur concerne (jsdom>undici) et le borner par caret sur la majeure — un consommateur qui touche aux modules internes d'une lib casse au premier saut de majeure, et le symptome remonte deguise (connexion impossible, MODULE_NOT_FOUND), jamais en erreur de version."
  provenance: { who: self, context: "minage retrospectif claude-mem ; observations #8334, #8353, #8354, #2961 ; egalement observe dans : automate-binance" }
  seen: 1
  added_at: "2026-07-31"
  last_updated: "2026-07-31"
  valid_at: "2026-07-31"
- id: sur-un-site-prerendu-puis-hydrate-par-un-gesti-2026-07-31
  trigger: "prerender, react-helmet-async, data-rh, hydratation, canonical_multiple, hreflang, json-ld, application/ld+json, se ranking audit, ghostmeta, vite ssg, duplicate structured data, googlebot js"
  symptom: "Le gestionnaire de head ne remplace que les balises qu'il reconnait comme siennes ; les balises injectees par le prerender lui sont invisibles, donc il ajoute les siennes en plus au lieu de les substituer, ce qui a produit 46 pages en canonical_multiple et du JSON-LD FAQ divergent entre prerender et runtime."
  rule: "Sur un site prerendu puis hydrate par un gestionnaire de <head> cote client (react-helmet-async, vue-meta, next/head), marquer les balises SEO du HTML prerendu avec l'attribut de propriete du gestionnaire (data-rh) ou les retirer au montage : sinon canonical, description, hreflang et JSON-LD existent en double apres hydratation, et cela ne se voit ni dans le HTML statique ni dans le DOM avant hydratation."
  provenance: { who: self, context: "minage retrospectif claude-mem ; observations #2128, #8184, #8188, #8458" }
  seen: 1
  added_at: "2026-07-31"
  last_updated: "2026-07-31"
  valid_at: "2026-07-31"
- id: sur-une-spa-servie-par-une-regle-de-reecriture-2026-07-31
  trigger: "vercel.json, rewrites, spa fallback, netlify redirects, nginx try_files, soft 404, /.env, /.git/HEAD, scan de securite, x-robots-tag, faux positif 200"
  symptom: "La regle { source: "/((?!api/).*)", destination: "/index.html" } sert l'application pour n'importe quel chemin, donc /.env, /.git/HEAD, /admin, /wp-admin renvoient tous 200 : un fichier reellement deploye devient indiscernable d'une 404, et l'absence de vrai 404 cree des soft 404 cote moteurs."
  rule: "Sur une SPA servie par une regle de reecriture attrape-tout (vercel.json rewrites, netlify _redirects, nginx try_files), ne jamais conclure a la presence ou a l'absence d'un fichier depuis le code HTTP : tout chemin inexistant rend 200 avec index.html ; exclure explicitement les chemins sensibles de la reecriture et verifier le corps de la reponse, pas son statut."
  provenance: { who: self, context: "minage retrospectif claude-mem ; observations #2485" }
  seen: 1
  added_at: "2026-07-31"
  last_updated: "2026-07-31"
  valid_at: "2026-07-31"
- id: pour-degrader-gracieusement-quand-une-configur-2026-07-31
  trigger: "supabase createClient, VITE_SUPABASE_URL, graceful degradation, placeholder, vite preview, .env manquant, ErrorBoundary, render_crash, validation d'entree de sdk, nullish coalescing"
  symptom: "createClient de @supabase/supabase-js leve « supabaseUrl is required » / « supabaseKey is required » sur chaine vide (dist/index.mjs lignes 150 et 200), donc le fallback '' plantait toujours a l'initialisation du module et faisait tomber toute la chaine d'imports jusqu'au RENDER_CRASH de l'ErrorBoundary."
  rule: "Pour degrader gracieusement quand une configuration externe manque, ne pas remplacer la valeur absente par une chaine vide : lire le code source de la bibliotheque pour connaitre ses contraintes de validation et fournir un placeholder syntaxiquement valide (URL parsable, cle non vide) — sinon le crash est simplement deplace de l'absence de config vers la validation de la lib."
  provenance: { who: self, context: "minage retrospectif claude-mem ; observations #8376, #8377" }
  seen: 1
  added_at: "2026-07-31"
  last_updated: "2026-07-31"
  valid_at: "2026-07-31"
