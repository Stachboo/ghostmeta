- id: seo-skill-version-scripts-missing
  trigger: "skill,seo-google,plugin,script-python,credentials"
  symptom: "Le skill seo-google chargé documentait des scripts Python (scripts/, extensions/google/) mais le package installé ne contenait que la doc (SKILL.md, references/) ; aucun fichier scripts/ ni credentials Google Cloud n'existait sur disque."
  rule: "Avant d'exécuter une commande qu'un skill documente, vérifier que les fichiers qu'elle référence (scripts, config, credentials) existent réellement sur disque dans le package installé ; ne pas supposer que la doc du skill reflète le contenu effectivement livré."
  provenance: { who: self, context: "consolidation du sommeil (SessionEnd)" }
  seen: 1
  added_at: "2026-07-18"
  last_updated: "2026-07-18"
  valid_at: "2026-07-18"
- id: webfetch-no-raw-http-headers
  trigger: "webfetch,headers,http,curl,securite,csp,hsts"
  symptom: "WebFetch a été utilisé pour vérifier les headers de sécurité HTTP d'une page mais ne montre que le contenu rendu en markdown, pas les headers bruts de la réponse."
  rule: "Pour inspecter des headers HTTP bruts (CSP, HSTS, Content-Encoding, etc.), utiliser curl (ou équivalent bas niveau), jamais WebFetch qui ne restitue que le contenu rendu."
  provenance: { who: self, context: "consolidation du sommeil (SessionEnd)" }
  seen: 1
  added_at: "2026-07-18"
  last_updated: "2026-07-18"
  valid_at: "2026-07-18"
- id: stale-edge-cache-false-security-alarm
  trigger: "cache,edge,age-header,curl,prod,headers-manquants,faux-positif"
  symptom: "Deux premiers curl sur la prod montraient des headers de sécurité (HSTS, X-Frame-Options, etc.) absents alors qu'ils étaient bien configurés côté serveur ; la réponse portait un header Age non-nul (36 puis 394) signalant une réponse edge-cache périmée, ignoré au premier passage."
  rule: "Avant d'affirmer qu'un header ou un comportement HTTP est absent en prod, vérifier le header Age (ou équivalent cache) de la réponse curl et refaire un test avec cache-buster ou sur une route fraîche ; un Age non-nul invalide la conclusion tirée de cette réponse."
  provenance: { who: self, context: "consolidation du sommeil (SessionEnd)" }
  seen: 1
  added_at: "2026-07-18"
  last_updated: "2026-07-18"
  valid_at: "2026-07-18"
- id: grep-oE-fails-on-minified-single-line-html
  trigger: "grep,regex,minified,html,build,prerender,bundle-js"
  symptom: "grep -oE a échoué silencieusement (ou n'a rien retourné) sur du HTML/JS minifié tenant sur une seule ligne très longue, faisant croire à une absence de contenu qui était en réalité présent."
  rule: "Sur un fichier minifié tenant en une ligne géante, ne pas se fier à grep -oE pour confirmer présence/absence de contenu ; utiliser une recherche de chaîne fixe ou un script (Python) qui lit et parse le fichier explicitement."
  provenance: { who: self, context: "consolidation du sommeil (SessionEnd)" }
  seen: 1
  added_at: "2026-07-18"
  last_updated: "2026-07-18"
  valid_at: "2026-07-18"
- id: local-build-vs-prod-build-env-mismatch
  trigger: "vite,build-local,env-vars,dead-code-elimination,bundle-hash,vercel"
  symptom: "Un bundle JS buildé localement (sans les secrets d'environnement) a des hashes de chunk différents du bundle réellement servi en prod ; comparer les deux a conduit à deux fausses alertes successives (absence d'URL checkout, puis confusion sur quel fichier est le vrai chunk prod vs un fallback SPA)."
  rule: "Ne jamais comparer un build local (sans secrets d'environnement) au bundle prod pour juger si une variable d'env est configurée : télécharger et inspecter directement les fichiers réellement servis par la prod (mêmes noms de hash que le build prod, pas ceux du build local), car les env vars absentes au build éliminent le code mort (dead-code elimination) et changent le contenu du bundle."
  provenance: { who: self, context: "consolidation du sommeil (SessionEnd)" }
  seen: 1
  added_at: "2026-07-18"
  last_updated: "2026-07-18"
  valid_at: "2026-07-18"
- id: bash-chain-silent-stop-on-grep-nomatch
  trigger: "bash,grep,exit-code,chaine-de-commandes,&&"
  symptom: "Une chaîne de commandes avec && s'est arrêtée silencieusement après le premier grep car ce grep n'a rien trouvé (exit code 1), empêchant l'exécution des commandes suivantes sans message d'erreur explicite."
  rule: "Ne pas chaîner grep avec && quand un résultat vide est une issue normale possible ; séparer les commandes ou utiliser grep ... ; true / grep ... || echo none pour éviter qu'un exit non-zéro de grep coupe silencieusement la suite de la chaîne."
  provenance: { who: self, context: "consolidation du sommeil (SessionEnd)" }
  seen: 1
  added_at: "2026-07-18"
  last_updated: "2026-07-18"
  valid_at: "2026-07-18"
- id: gitbash-windows-quoting-mangling
  trigger: "git-bash,windows,backtick,chemin,slash,variable,powershell"
  symptom: "Des backticks et des ${...} dans une commande bash ont été altérés/expansés avant exécution, et des chemins commençant par / ont été mal interprétés (path mangling Git Bash sous Windows), causant des résultats faux ou tronqués."
  rule: "Sous Git Bash sur Windows, éviter d'inliner des backticks, des ${...} ou des chemins commençant par / dans une commande shell complexe ; écrire le script dans un fichier (Python ou autre) et l'exécuter, pour éviter les mangling d'échappement et de conversion de chemin propres à Git Bash sur Windows."
  provenance: { who: self, context: "consolidation du sommeil (SessionEnd)" }
  seen: 1
  added_at: "2026-07-18"
  last_updated: "2026-07-18"
  valid_at: "2026-07-18"
- id: playwright-mcp-restricted-upload-dirs
  trigger: "playwright,mcp,upload,file-chooser,fichier-test,input-file"
  symptom: "Un upload de fichier via le MCP Playwright a échoué car le chemin du fichier test se trouvait hors des répertoires autorisés par le MCP."
